version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sales_bi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sales_bi_user
      POSTGRES_PASSWORD: strong_password
      POSTGRES_DB: sales_bi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_bi_user -d sales_bi"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sales_bi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales_bi_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-CHANGE_THIS_SECRET_KEY_IN_PRODUCTION_1234567890}
      DATABASE_URL: postgresql+psycopg2://sales_bi_user:strong_password@postgres:5432/sales_bi
      USE_REDIS: "true"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage
      - backend_logs:/app/logs

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: sales_bi_dashboard
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"

volumes:
  postgres_data:
  backend_storage:
  backend_logs:

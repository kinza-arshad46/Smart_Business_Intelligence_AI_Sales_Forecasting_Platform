name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ------------------------------------------------------------------
  # 1. Lint & test the backend
  # ------------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        working-directory: backend
        run: |
          flake8 app --max-line-length=120 --extend-ignore=E203,W503 --exclude=__pycache__

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: ci-test-secret-key
        run: |
          pytest -v --tb=short

  # ------------------------------------------------------------------
  # 2. Build Docker images (validates Dockerfiles build cleanly)
  # ------------------------------------------------------------------
  build-images:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: sales-bi-backend:ci

      - name: Build dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: false
          tags: sales-bi-dashboard:ci

  # ------------------------------------------------------------------
  # 3. Deploy (placeholder - fill in for your cloud provider)
  # ------------------------------------------------------------------
  deploy:
    needs: build-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy notice
        run: |
          echo "Add deployment steps here for your target platform, e.g.:"
          echo " - AWS: aws ecs update-service / eb deploy / CDK"
          echo " - Azure: az webapp deployment / az containerapp update"
          echo " - GCP: gcloud run deploy"
          echo "Store cloud credentials as GitHub Actions secrets, never commit them."
